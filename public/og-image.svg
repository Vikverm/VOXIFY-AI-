<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#090d16" />
      <stop offset="50%" stopColor="#0f172a" />
      <stop offset="100%" stopColor="#030712" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stopColor="#38bdf8" stop-opacity="0.25" />
      <stop offset="50%" stopColor="#6366f1" stop-opacity="0.2" />
      <stop offset="100%" stopColor="#a855f7" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stopColor="#38bdf8" />
      <stop offset="50%" stopColor="#6366f1" />
      <stop offset="100%" stopColor="#a855f7" />
    </linearGradient>
    <linearGradient id="bgSquircleGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stopColor="#2563eb" />
      <stop offset="50%" stopColor="#4f46e5" />
      <stop offset="100%" stopColor="#7c3aed" />
    </linearGradient>
    <filter id="blurFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="80" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Ambient background glow spheres -->
  <circle cx="200" cy="180" r="280" fill="url(#glowGrad)" filter="url(#blurFilter)" />
  <circle cx="1000" cy="450" r="320" fill="url(#glowGrad)" filter="url(#blurFilter)" />

  <!-- Brand Card Container -->
  <g transform="translate(100, 100)">
    <!-- Logo Squircle -->
    <rect x="0" y="0" width="88" height="88" rx="26" fill="url(#bgSquircleGrad)" />
    <g transform="translate(14, 14)">
      <!-- Symmetrical V Waveform in crisp white and bright cyan -->
      <rect x="6" y="10" width="6" height="24" rx="3" fill="#ffffff" fill-opacity="0.88" />
      <rect x="18" y="20" width="6" height="26" rx="3" fill="#ffffff" fill-opacity="0.95" />
      <rect x="30" y="30" width="6" height="28" rx="3" fill="#67e8f9" />
      <rect x="42" y="20" width="6" height="26" rx="3" fill="#ffffff" fill-opacity="0.95" />
      <rect x="54" y="10" width="6" height="24" rx="3" fill="#ffffff" fill-opacity="0.88" />
    </g>

    <!-- Brand Typography -->
    <text x="110" y="58" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="52" font-weight="900" fill="#ffffff" letter-spacing="-1.5">Voxify</text>
    <rect x="270" y="24" width="60" height="34" rx="8" fill="#4f46e5" fill-opacity="0.3" stroke="#6366f1" stroke-width="1.5" />
    <text x="300" y="47" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="17" font-weight="800" fill="#818cf8" text-anchor="middle" letter-spacing="1">AI</text>

    <!-- Main Headline with SEO high-intent keywords -->
    <text x="0" y="165" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="46" font-weight="800" fill="#ffffff" letter-spacing="-1">
      Free AI Voice Generator &amp; Text to Speech Studio
    </text>

    <!-- Subtitle / Value Proposition -->
    <text x="0" y="225" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="22" font-weight="500" fill="#94a3b8">
      Synthesize ultra-realistic human voices with neural emotion routing, multi-character dialogue,
    </text>
    <text x="0" y="260" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="22" font-weight="500" fill="#94a3b8">
      SSML timing controls, and 48kHz uncompressed audio mastering for creators &amp; developers.
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 315)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="220" height="46" rx="23" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <circle cx="24" cy="23" r="5" fill="#10b981" />
      <text x="40" y="28" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="600" fill="#f1f5f9">10,000 Free Credits</text>

      <!-- Pill 2 -->
      <rect x="236" y="0" width="230" height="46" rx="23" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <circle cx="260" cy="23" r="5" fill="#38bdf8" />
      <text x="276" y="28" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="600" fill="#f1f5f9">48kHz Studio Master</text>

      <!-- Pill 3 -->
      <rect x="482" y="0" width="210" height="46" rx="23" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <circle cx="506" cy="23" r="5" fill="#818cf8" />
      <text x="522" y="28" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="600" fill="#f1f5f9">SSML Emotion Engine</text>

      <!-- Pill 4 -->
      <rect x="708" y="0" width="220" height="46" rx="23" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <circle cx="732" cy="23" r="5" fill="#ec4899" />
      <text x="748" y="28" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="600" fill="#f1f5f9">Commercial License</text>
    </g>
  </g>

  <!-- Bottom Bar -->
  <rect x="0" y="618" width="1200" height="12" fill="url(#waveGrad)" />
</svg>
